spec_version: "1.1"
slug: yorum-ozetleyici
name: Akıllı Yorum Özetleyici
version: 1.0.0
author:
  name: Enes Baykal
  github: enesbaykal730-bit
category: e-ticaret
short_note: >-
  Ürün yorumlarını analiz eder; öne çıkan artıları, eksileri ve genel duygu skorunu özetler.
description_file: docs/DESCRIPTION.md
languages: [tr, en]
assets:
  icon: assets/icon.png
  cover: assets/cover.png
  screenshots:
    - assets/screenshots/1.png
    - assets/screenshots/2.png
    - assets/screenshots/3.png
types: [api, event, mcp]

runtime:
  port: 8080
  memory_mb: 512
  cpu: 0.5
  models: [fast]

network:
  allow: []

operations:
  summarize_reviews:
    description: "Verilen ürün yorumları listesini analiz ederek artılar, eksiler ve duygu skoru üretir."
    timeout_s: 20
    input_schema:
      type: object
      required: [product_name, reviews]
      properties:
        product_name:
          type: string
          maxLength: 150
        reviews:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 1000
    output_schema:
      type: object
      required: [summary, sentiment_score, pros, cons, review_count]
      properties:
        summary:
          type: string
        sentiment_score:
          type: number
          minimum: 1
          maximum: 5
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string
        review_count:
          type: integer

events:
  review.created: summarize_reviews

config_schema:
  type: object
  properties:
    dil:
      type: string
      enum: [tr, en]
      default: tr
      title: "Özet çıktı dili"
    max_madde:
      type: integer
      default: 3
      minimum: 1
      maximum: 5
      title: "En fazla artı/eksi madde sayısı"

demo:
  config:
    dil: tr
    max_madde: 3
  samples:
    - operation: summarize_reviews
      input:
        product_name: "Kablosuz Gürültü Önleyici Kulaklık"
        reviews:
          - "Ses kalitesi muazzam, baslar çok doyurucu ve şarjı 3 gün gidiyor."
          - "ANC özelliği metroda bile dış sesi tamamen kesiyor ama uzun kullanımda kulakları biraz terletiyor."
          - "Fiyatına göre malzeme kalitesi çok iyi, sadece taşıma çantası biraz büyük."
